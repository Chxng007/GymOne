spring.application.name=gym

# Render inyecta PORT y espera que el proceso escuche ahí; SERVER_PORT queda
# como escape local.
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/gymone_db}
spring.datasource.username=${DB_USERNAME:gymone}
spring.datasource.password=${DB_PASSWORD:gymone}

# El pooler de Supabase reparte un cupo de conexiones entre todo el proyecto:
# conviene que una instancia no se lo coma entero.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Se suman a la lista de arriba, no la reemplazan. Van aparte porque Vercel crea
# un dominio por despliegue y alias por rama: con una lista exacta siempre acabás
# entrando por una URL legítima que no está enumerada.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://gymone-*.vercel.app}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.admin.default-email=${ADMIN_EMAIL:admin@gymone.local}
app.admin.default-password=${ADMIN_PASSWORD}

# Acceso de invitado sin credenciales, para que el despliegue público se pueda
# recorrer sin pedirle nada a nadie. Es un bypass de autenticación deliberado:
# en una instalación real de un gimnasio, DEMO_ENABLED=false.
app.demo.enabled=${DEMO_ENABLED:true}
app.demo.email=${DEMO_EMAIL:demo@gymone.com}
app.demo.nombre=${DEMO_NOMBRE:Invitado}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

gemini.api-key=${GEMINI_API_KEY:}
