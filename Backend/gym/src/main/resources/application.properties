spring.application.name=gym

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gymOne}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.docker.compose.enabled=false

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

jwt.secret=${JWT_SECRET:Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1mb3ItZ3ltb25lLWp3dC1zaWduaW5nLTEyMzQ1Ng==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.admin.default-email=${APP_ADMIN_DEFAULT_EMAIL:admin@gymone.com}
app.admin.default-password=${APP_ADMIN_DEFAULT_PASSWORD:Admin123!}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

gemini.api-key=${GEMINI_API_KEY:}
