# Blueprint de Render para la API de GymOne.
# En Render: New > Blueprint > conecta este repositorio. Las variables marcadas
# como sync:false las pide el panel al crear el servicio y no se versionan.
services:
  - type: web
    name: gymone-api
    runtime: docker
    repo: https://github.com/Chxng007/GymOne
    branch: main
    # Ohio es la región gratuita más cercana a ca-central-1, donde vive la base
    # de Supabase. Cada consulta JDBC paga ese viaje de ida y vuelta.
    region: ohio
    plan: free
    rootDir: Backend/gym
    dockerfilePath: ./Dockerfile
    # Sin esto Render solo mira si el puerto está abierto, que sigue estándolo
    # aunque la aplicación esté atascada. Apunta a la sonda que NO consulta la
    # base: un corte de Supabase no debe provocar reinicios en cadena.
    healthCheckPath: /api/salud/vida
    envVars:
      # Sin esto, spring-boot-docker-compose intenta levantar compose.yaml
      # dentro del contenedor y el arranque falla.
      - key: DOCKER_COMPOSE_ENABLED
        value: "false"
      # La instancia gratuita tiene 512 MB y el heap no es lo único que gasta:
      # metaspace, pilas de hilos y buffers nativos van por fuera. Con el 70%
      # anterior (~358 MB de heap) la suma se pasaba de 512 con facilidad, y ahí
      # el kernel mata el proceso sin avisar. El 55% deja margen para el resto.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=55 -XX:MaxMetaspaceSize=128m -Xss512k"
      # Tomcat abre 200 hilos por defecto. Para una demo sobran, y cada uno
      # reserva su pila.
      - key: TOMCAT_MAX_THREADS
        value: "20"
      - key: DB_POOL_SIZE
        value: "5"
      # Este despliegue es una demo pública: cualquiera entra sin credenciales.
      # Para una instalación real de un gimnasio, ponlo en false.
      - key: DEMO_ENABLED
        value: "true"
      # JwtUtil hace Decoders.BASE64.decode() y exige >=32 bytes ya decodificados,
      # así que no sirve cualquier cadena aleatoria: genérala con
      #   openssl rand -base64 48
      - key: JWT_SECRET
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Se suman a CORS_ALLOWED_ORIGINS. Cubren los dominios que Vercel genera
      # por despliegue y por rama, que no se pueden enumerar de antemano.
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: "https://gymone-*.vercel.app"
